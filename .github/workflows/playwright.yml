name: Playwright tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      docker:
        description: Run tests in Docker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ inputs.docker == true && 'Docker · Chromium' || format('Chromium · {0}', matrix.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Docker запускается только на Linux; обычный CI проверяет все три ОС.
        os: ${{ fromJSON(inputs.docker == true && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types and Playwright versions
        run: npm run check

      - name: Validate Docker Compose configuration
        if: runner.os == 'Linux'
        run: docker compose --profile report config --quiet

      - name: Install Chromium
        if: ${{ inputs.docker != true }}
        run: npx playwright install --with-deps chromium

      - name: Run tests
        if: ${{ inputs.docker != true }}
        run: npm test -- --workers=1

      - name: Build and run tests in Docker
        if: ${{ inputs.docker == true }}
        run: docker compose run --build --rm tests

      - name: Upload report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}${{ inputs.docker == true && '-docker' || '' }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
