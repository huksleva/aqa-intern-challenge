name: Playwright tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      docker:
        description: Run tests in Docker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chromium · 3 scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Validate Docker Compose configuration
        run: docker compose --profile report config --quiet

      - name: Install Chromium
        if: ${{ inputs.docker != true }}
        run: npx playwright install --with-deps chromium

      - name: Run tests
        if: ${{ inputs.docker != true }}
        run: npm test -- --workers=1

      - name: Build and run tests in Docker
        if: ${{ inputs.docker == true }}
        run: docker compose run --build --rm tests

      - name: Upload report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
